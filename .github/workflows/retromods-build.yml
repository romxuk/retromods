name: RetroMods builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Assemble pinned Ryubing source and RetroMods changes
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://git.ryujinx.app/projects/Ryubing upstream
          git -C upstream checkout 475615f0431b4995b03c930c5089d20f6f3570e0
          cp -a src/. upstream/src/
          git -C upstream diff --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: upstream/global.json
      - name: Test Eagle routing
        working-directory: upstream
        run: dotnet test src/Ryujinx.Tests/Ryujinx.Tests.csproj -c Release --filter 'FullyQualifiedName~EagleBootstrapTests|FullyQualifiedName~BcatCompatibilityTests' -p:ExtraDefineConstants=DISABLE_UPDATER
      - name: Publish standalone emulator
        working-directory: upstream
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -o ../publish -p:Version=1.0.2-retromods -p:ExtraDefineConstants=DISABLE_UPDATER
      - name: Package emulator
        shell: bash
        run: |
          tar -czf retromods-${{ matrix.runtime }}.tar.gz -C publish .
      - uses: actions/upload-artifact@v4
        with:
          name: retromods-${{ matrix.runtime }}
          path: retromods-${{ matrix.runtime }}.tar.gz
          if-no-files-found: error
      - name: Package corresponding source
        if: matrix.runtime == 'linux-x64'
        run: tar --exclude=.git --exclude=bin --exclude=obj -czf retromods-source.tar.gz -C upstream .
      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'linux-x64'
        with:
          name: retromods-source
          path: retromods-source.tar.gz
          if-no-files-found: error
